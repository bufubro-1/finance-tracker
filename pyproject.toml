[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-tracker"
version = "0.1.0"
description = "Local-first Finance Tracker runtime skeleton"
requires-python = ">=3.14,<3.15"
dependencies = ["streamlit==1.66.1", "Django==5.2.19"]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"finance_tracker.django_app" = ["templates/**/*.html", "static/**/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
